<!doctype html>
<!--
  A mock of intent, with a fake repo, used to draw docs/demo/intent.gif: the pane, "Open the review", then the review page.
  Each frame is a step of the story, picked by the URL hash (demo.html#3). Regenerate the GIF: docs/demo/record.sh
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>intent demo</title>
<style>
  :root {
    --dark: #262624; --dark-2: #1f1e1d; --dark-text: #e8e6dc; --dark-dim: #9c9a92; --claude: #d97757;
    --bg: #f6f5fb; --surface: #fff; --text: #1d1b2c; --muted: #646179; --border: #e2e0ee;
    --violet: #6a3cf0; --violet-soft: #efeaff; --blue: #175fe6; --add-bg: #e6f6eb; --add-gutter: #cdeed7; --amber: #a85c00; --amber-soft: #fff1d9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 1040px; height: 640px; overflow: hidden; background: var(--dark-2); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  code, .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  .stage { position: absolute; inset: 16px; border-radius: 12px; overflow: hidden; border: 1px solid #3a3936; }

  /* Claude Desktop: the conversation and the intent pane */
  .desktop { display: flex; height: 100%; background: var(--dark); color: var(--dark-text); }
  .chat { flex: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid #3a3936; }
  .msg-user { align-self: flex-end; background: #3a3936; padding: 10px 14px; border-radius: 12px; max-width: 70%; }
  .msg-claude { max-width: 90%; }
  .tool { color: var(--dark-dim); font-size: 13px; }
  .pane { width: 380px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .pane-title { font-weight: 600; display: flex; } .pane-title span { margin-left: auto; color: var(--dark-dim); font-weight: 400; }
  .dim { color: var(--dark-dim); }
  .ok { color: #6cc27e; }
  .intentions { display: flex; flex-direction: column; gap: 6px; }
  .intentions b { color: #b9a4ff; font-weight: 600; }
  .btn { display: inline-block; border: 1px solid #55534e; border-radius: 6px; padding: 3px 12px; background: #2f2e2b; font-size: 13px; }
  .btn.primary { background: var(--claude); border-color: var(--claude); color: #1f1e1d; font-weight: 600; }
  .pressed { outline: 2px solid #fff; outline-offset: 2px; }

  /* The review page in the browser */
  .browser { height: 100%; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  .bar { background: #e9e7f2; padding: 8px 14px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #d4d1e0; }
  .url { margin-left: 12px; flex: 1; background: #fff; border-radius: 6px; padding: 3px 10px; color: var(--muted); font-size: 12.5px; }
  .top { padding: 14px 24px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  .top-row { display: flex; align-items: baseline; gap: 10px; }
  .top h1 { font-size: 18px; margin: 0; }
  .pr { color: var(--blue); }
  .publish { margin-left: auto; background: var(--violet); color: #fff; border-radius: 7px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
  .tabs { display: flex; gap: 20px; margin-top: 10px; }
  .tab { padding: 6px 0; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--violet); border-color: var(--violet); font-weight: 600; }
  .main { padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .intention { display: flex; gap: 10px; align-items: baseline; }
  .badge { color: var(--violet); font-weight: 700; }
  .origin { font-size: 12px; padding: 0 8px; border-radius: 10px; background: var(--violet-soft); color: var(--violet); }
  .origin.inferred { background: var(--amber-soft); color: var(--amber); }
  .why { color: var(--muted); font-size: 13px; margin-left: 22px; }
  .file { color: var(--blue); font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .diff { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 8px; }
  .diff .row { display: flex; background: var(--add-bg); white-space: pre; }
  .diff .row.ctx { background: #fff; }
  .diff .num { width: 40px; text-align: right; padding-right: 8px; background: var(--add-gutter); color: #4e7d5c; }
  .diff .ctx .num { background: #f0eff7; color: var(--muted); }
  .diff .txt { padding-left: 8px; }
  .note { margin: 6px 0 6px 40px; padding: 8px 12px; border-left: 3px solid var(--violet); background: var(--violet-soft); border-radius: 0 8px 8px 0; display: flex; gap: 10px; align-items: baseline; }
  .note p { margin: 0; flex: 1; }
  .ask { border: 1px solid var(--violet); color: var(--violet); border-radius: 6px; padding: 1px 10px; font-size: 12.5px; background: #fff; white-space: nowrap; }
  .ask.pressed { outline: 2px solid var(--violet); }
  .sent { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .answer { margin: 6px 0 6px 40px; padding: 10px 14px; border: 1px solid var(--border); background: #fff; border-radius: 8px; }
  .answer em { color: var(--muted); }
  .answer p { margin: 6px 0 0; }
  .answer ul { margin: 6px 0; padding-left: 20px; }
  .mark { font-size: 12px; color: var(--violet); }
  .tree { display: flex; flex-direction: column; gap: 4px; width: 300px; }
  .tree .f { display: flex; gap: 8px; }
  .tag { font-size: 12px; color: var(--muted); } .tag.key { color: var(--violet); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
// One entry per frame: where the story is.
const STEPS = ['pane', 'press', 'story', 'chapter', 'ask', 'running', 'answer', 'files']
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const PANE = press => `
<div class="desktop">
  <div class="chat">
    <div class="msg-user">Add a rate limit to the API: 100 requests a minute per key, and tell clients when to retry.</div>
    <div class="msg-claude">I added a Redis-backed limiter in front of the routes, with a 429 and a <code>Retry-After</code> header past the limit, and a test for it.</div>
    <div class="tool">✎ src/middleware/rate-limit.ts · src/app.ts · tests/rate-limit.test.ts · .env.example</div>
  </div>
  <div class="pane">
    <div class="pane-title">Review <span>✕</span></div>
    <div class="dim">api · feat/rate-limiting</div>
    <div><span class="ok">●</span> Review up to date &nbsp;<span class="btn primary${press ? ' pressed' : ''}">Open the review</span></div>
    <div>Adds a rate limit to the API: 100 requests a minute per API key, counted in Redis, and a 429 with Retry-After past the limit.</div>
    <div class="intentions">
      <div class="dim">Intentions</div>
      <div><b>①</b> Limit each API key to 100 requests a minute</div>
      <div><b>②</b> Tell clients when to come back</div>
      <div><b>③</b> Share the count between instances</div>
    </div>
    <div class="dim">4 files · on the review page</div>
  </div>
</div>`

const TOP = tab => `
<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">127.0.0.1:4312/?t=…</span></div>
<div class="top">
  <div class="top-row"><h1>api · feat/rate-limiting</h1><span class="pr">#42 feat: add rate limiting</span><span class="publish">Publish</span></div>
  <div class="tabs"><span class="tab${tab === 'story' ? ' on' : ''}">Story</span><span class="tab${tab === 'files' ? ' on' : ''}">Files</span></div>
</div>`

const intention = (n, title, why, inferred) => `
  <div><div class="intention"><span class="badge">${n}</span><b>${title}</b><span class="origin${inferred ? ' inferred' : ''}">${inferred ? 'inferred' : 'from the conversation'}</span></div>
    <div class="why">${why}</div></div>`

const STORY = `
<div class="card">
  <div class="label">In short</div>
  <p style="margin:4px 0 0">Adds a rate limit to the API: 100 requests a minute per API key, counted in Redis so every instance shares it, and a 429 with Retry-After past the limit.</p>
</div>
<div class="card" style="display:flex;flex-direction:column;gap:8px">
  <div class="label">Intentions</div>
  ${intention('①', 'Limit each API key to 100 requests a minute', 'One client flooded the API last week; the limit protects everyone else.')}
  ${intention('②', 'Tell clients when to come back', 'A 429 with Retry-After lets well-behaved clients slow down instead of retrying in a loop.')}
  ${intention('③', 'Share the count between instances', 'With a counter in memory, each instance would allow 100 requests of its own.', true)}
</div>`

const rows = lines => `<div class="diff code">${lines.map(([n, t, ctx]) =>
  `<div class="row${ctx ? ' ctx' : ''}"><span class="num">${n}</span><span class="txt">${ctx ? ' ' : '+'}${esc(t)}</span></div>`).join('')}</div>`

const LIMITER = rows([
  [11, '  const window = Math.floor(Date.now() / 1000 / WINDOW_SECONDS)'],
  [12, '  const counter = `rate:${key}:${window}`'],
  [13, '  const count = await redis.incr(counter)'],
  [14, '  if (count === 1) await redis.expire(counter, WINDOW_SECONDS)'],
])

const ANSWER = `
<div class="answer">
  <em>What's happening here?</em>
  <p>A <b>fixed-window</b> counter:</p>
  <ul>
    <li><code>window</code> is the current minute, so the key <code>rate:&lt;key&gt;:&lt;minute&gt;</code> changes every minute and the count starts again from 0.</li>
    <li><code>incr</code> adds one and returns the count in a single Redis call: two instances can never both read 99 and both let a request through.</li>
    <li><code>expire</code> runs on the first request only, so the counter deletes itself after a minute.</li>
  </ul>
  <span class="mark">Added to your review</span>
</div>`

function chapter(step) {
  const action = step === 'chapter' ? `<span class="ask">What's happening here?</span>`
    : step === 'ask' ? `<span class="ask pressed">What's happening here?</span>`
    : '<span class="sent">Sent ✓</span>'
  const after = step === 'running' ? `<div class="answer"><em>What's happening here?</em><p style="color:var(--muted)">Answering…</p></div>`
    : step === 'answer' ? ANSWER : ''
  return `
<div class="card">
  <div class="intention"><span class="badge">①</span><b>Limit each API key to 100 requests a minute</b><span class="origin">from the conversation</span></div>
  <div style="margin-top:8px"><span class="file">src/middleware/rate-limit.ts</span> <span class="meta">added · key · The limiter: counts each key's requests per minute</span></div>
  ${LIMITER}
  <div class="note"><span class="badge">①</span><p>One counter per key and per minute. The first request of a window makes it expire, so old windows clean themselves up.</p>${action}</div>
  ${after}
</div>`
}

const FILES = `
<div style="display:flex;gap:16px">
  <div class="card tree">
    <div class="label">4 files</div>
    <div class="f"><span>src/middleware/rate-limit.ts</span><span class="tag key">key</span></div>
    <div class="f"><span class="file">src/app.ts</span></div>
    <div class="f"><span>tests/rate-limit.test.ts</span></div>
    <div class="f"><span>.env.example</span><span class="tag">minor</span></div>
  </div>
  <div class="card" style="flex:1">
    <span class="file">src/app.ts</span> <span class="meta">modified · Puts the limiter in front of the API routes</span>
    ${rows([[8, 'app.use(express.json())', true], [9, 'app.use(auth)', true], [10, 'app.use(rateLimit)'], [11, "app.use('/v1', routes)", true]])}
    <div class="note"><span class="badge">①</span><p>After auth, so the key is already checked, and before the routes, so every endpoint is covered.</p><span class="ask">What's happening here?</span></div>
  </div>
</div>`

function render(step) {
  const stage = document.getElementById('stage')
  if (step === 'pane' || step === 'press') {
    stage.innerHTML = PANE(step === 'press')
    return
  }
  const body = step === 'story' ? STORY : step === 'files' ? FILES : chapter(step)
  stage.innerHTML = `<div class="browser">${TOP(step === 'files' ? 'files' : 'story')}<div class="main">${body}</div></div>`
}

render(STEPS[Math.min(Number(location.hash.slice(1)) || 0, STEPS.length - 1)])
</script>
</body>
</html>
